# 黄金链路：health → 注册 → 登录 → 建场景 → 建数据集 → 建方案 → 发起运行 → 取结果
#
# 注意 auth 域的 wire 键是 snake_case（access_token / token_type），
# 与其它域的 camelCase 不同 —— 断言键名以 OpenAPI 为准，别凭 Python 字段名写。
cases:
  - id: T1
    name: 健康检查
    tags: [smoke, e2e]
    steps:
      - method: GET
        path: /api/health
        auth: false
        asserts:
          - {target: "$.call.response.status", operator: eq, expected: 200}
          - {target: "$.call.response.body.status", operator: eq, expected: ok}

  - id: T2
    name: 注册自举账号
    tags: [smoke, e2e]
    steps:
      - method: POST
        path: /api/auth/register
        auth: false
        body:
          username: "${sb.new_username}"
          # display_name 也查重(平台 assert_name_available)，不能沿用自举账号
          # 那个固定值，否则 409。
          display_name: "${sb.new_username}"
          # 一次性口令，当场随机生成，跟管理员口令无关 —— 管理员口令不能进
          # definition（它会被平台存进 execution_snapshots）。
          password: "${sb.new_password}"
        asserts:
          - {target: "$.call.response.status", operator: eq, expected: 201}
          - {target: "$.call.response.body.user.username", operator: eq, expected: "${sb.new_username}"}
          - {target: "$.call.response.body.token_type", operator: eq, expected: bearer}

  - id: T3
    name: 登录取 token
    tags: [smoke, e2e]
    steps:
      - method: POST
        path: /api/auth/login
        auth: false
        body:
          username: "${sb.new_username}"
          password: "${sb.new_password}"
        extract: {expr: "$.call.response.body.access_token", target: sb_access_token}
        asserts:
          - {target: "$.call.response.status", operator: eq, expected: 200}
          - {target: "$.call.response.body.token_type", operator: eq, expected: bearer}

  - id: T4
    name: 读回建好的场景
    tags: [smoke, e2e]
    # 建场景这一步由编排器自己完成（每条用例都会建一个，${sb.scenario_id}
    # 指向的就是它，T5/T6 建在它上面）。这里不再重复 POST —— 同名再建必 409 ——
    # 改成读回来，验证发出去的 definition 真的落库了。
    steps:
      - method: GET
        path: /api/scenarios/${sb.scenario_id}
        asserts:
          - {target: "$.call.response.status", operator: eq, expected: 200}
          - {target: "$.call.response.body.meta.scenarioId", operator: eq, expected: "${sb.scenario_id}"}
          - {target: "$.call.response.body.meta.module", operator: eq, expected: self-bootstrap}
          - {target: "$.call.response.body.steps", operator: exists, expected: null}
          # 回读 call 形态：v2.1 批次 F 退役了 step.api，生成器改错了的话
          # 平台存进去的每个场景都是死的。这条把「生成对了」和「平台真存下了
          # 对的形状」连起来 —— 静态那门只管到生成侧。
          - {target: "$.call.response.body.steps.0.call.kind", operator: eq, expected: call}
          - {target: "$.call.response.body.steps.0.call.protocol", operator: eq, expected: http}

  - id: T5
    name: 建数据集
    tags: [smoke, e2e]
    steps:
      - method: POST
        path: /api/scenarios/${sb.scenario_id}/data-sets
        body:
          name: sb-dataset
          description: 自举数据集
          rows: []
        asserts:
          - {target: "$.call.response.status", operator: eq, expected: 201}
          - {target: "$.call.response.body.datasetId", operator: exists, expected: null}

  - id: T6
    name: 建运行方案
    tags: [smoke, e2e]
    steps:
      - method: POST
        path: /api/scenarios/${sb.scenario_id}/run-schemes
        body:
          name: sb-scheme
          isDefault: true
          nRuns: 1
          parallel: 1
        asserts:
          - {target: "$.call.response.status", operator: eq, expected: 201}
          - {target: "$.call.response.body.schemeId", operator: exists, expected: null}

  - id: T7
    name: 读常量池
    tags: [smoke, e2e]
    # 这里刻意**不** POST /api/runs：「发起运行」是编排器自己在做的事，
    # 每条用例都由编排器投递一次。场景里再投一次就是拿自己投自己 —— 每次
    # 运行都会再派生一次运行，无限递归。
    #
    # 也不能写 GET /api/runs —— 契约里 /api/runs 只有 POST，那是实跑第一次
    # 才暴露的 405。常量池是另一片没被覆盖的域，且不碰 PII。
    steps:
      - method: GET
        path: /api/constants
        asserts:
          - {target: "$.call.response.status", operator: eq, expected: 200}
          - {target: "$.call.response.body.items", operator: exists, expected: null}
          - {target: "$.call.response.body.total", operator: exists, expected: null}

  - id: T8
    name: 读执行结果
    tags: [smoke, e2e]
    steps:
      - method: GET
        path: /api/executions
        asserts:
          - {target: "$.call.response.status", operator: eq, expected: 200}
          - {target: "$.call.response.body.items", operator: exists, expected: null}
