[project]
name = "gimbal-platform-backend"
version = "0.1.0"
description = "Gimbal Platform backend (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # [asyncio] extras 钉 greenlet(sqlalchemy 2.1 起不再自带传递依赖,
    # 干净 venv 里 async engine 一 collect 即崩;A-2 残留,2026-10-13)
    "sqlalchemy[asyncio]>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.0",
    "PyYAML>=6.0",
    "cryptography>=42.0",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=3.1,<4.1",  # passlib 1.7.4 incompatible with bcrypt 4.1+ (no __about__)
    "python-multipart>=0.0.9",
    # 平台自身代码消费(plate_client/ServerSession);A-2 残留同族缺口
    "httpx>=0.28",
    # PG 驱动（PG迁移方案 §3.1）：asyncpg 运行时；alembic 迁移必经
    # （空库建库/版本校验，M2 起 lifespan 引用）。psycopg 仅 ETL/
    # preccheck 脚本用（同步 engine），按需安装见 constraints。
    # SQLite 方言已退役（2026-10-14）：aiosqlite 依赖随之下架。
    "asyncpg>=0.29",
    "alembic>=1.13",
    "python-dotenv>=1.0",
    "loguru>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

# ── pytest ────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
# Treat every ``async def test_*`` as an asyncio test (no per-test decorator).
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
