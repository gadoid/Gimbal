[project]
name = "gimbal-platform-backend"
version = "0.1.0"
description = "Gimbal Platform backend (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    # 版本上界(整体评审 2026-10-15 #6):主版本封顶,0.x 包封在 <1;
    # 精确版本以仓库根 requirements.lock 为准(CI/部署按 lock 安装)。
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    # [asyncio] extras 钉 greenlet(sqlalchemy 2.1 起不再自带传递依赖,
    # 干净 venv 里 async engine 一 collect 即崩;A-2 残留,2026-10-13)
    "sqlalchemy[asyncio]>=2.0,<3",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.0,<3",
    "PyYAML>=6.0,<7",
    "cryptography>=42.0,<51",
    # JWT / 口令哈希:python-jose 与 passlib 已长期停更(jose 有算法混淆
    # 类历史 CVE;passlib 迫使 bcrypt 锁 <4.1)—— 换 PyJWT + 原生 bcrypt
    # (存量 $2b$ 哈希格式相同,直接可校验;>72 字节按 passlib 口径截断)
    "PyJWT>=2.8,<3",
    "bcrypt>=4.1,<6",
    "python-multipart>=0.0.9,<1",
    # 平台自身代码消费(plate_client/ServerSession);A-2 残留同族缺口
    "httpx>=0.28,<1",
    # PG 驱动（PG迁移方案 §3.1）：asyncpg 运行时；alembic 迁移必经
    # （空库建库/版本校验，M2 起 lifespan 引用）。
    # psycopg[binary]：同步引擎 —— lifespan 的 ensure_schema_sync 与
    # 空库门测试都走它（A-3 根治）；ETL/preccheck 脚本同源复用。
    # SQLite 方言已退役（2026-10-14）：aiosqlite 依赖随之下架。
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.1,<4",
    "python-dotenv>=1.0,<2",
    "loguru>=0.7,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

# ── pytest ────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
# Treat every ``async def test_*`` as an asyncio test (no per-test decorator).
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
