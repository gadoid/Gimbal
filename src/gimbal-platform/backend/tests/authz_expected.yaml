# authz 人工审定快照(R7,dev-plan T0.2)—— 表 A 的期望值。
#
# 矩阵测试从表 A 生成只能证明「代码与表一致」(自证循环);本快照
# 是人工审定的期望,证明「表本身是对的」。表 A(_ownership.CAPABILITIES)
# 任何变更必须同步改这里 —— 快照即评审门,两边对拍不一致即红。
#
# 能力语义(v1,W2 收编的门面;W3-W9 只增不改语义):
#   users.manage     用户管理(开号/角色/停用/删除/重置密码)——原 admin 级
#   ops.write        技术运营(适配/别名/环境/导入/令牌签发/公告面)——原 member+ 级
#   platform.alerts  平台身份事件告警受众 —— 与 ops.write 同口径
table_a:
  user: []                       # user 级:自有内容读写不走表 A(对象级规则在表 B,W3 起)
  admin: [ops.write, platform.alerts]
  super_admin: [users.manage, ops.write, platform.alerts]

# 具名门 → 能力映射(deps.py;名字保留是 W8 前的兼容期)
gates:
  AdminUser: users.manage
  MemberUser: ops.write

# roles_with 的顺序契约(权威顺序低→高;SQL in_ 与展示共用)
roles_with:
  users.manage: [super_admin]
  ops.write: [admin, super_admin]
  platform.alerts: [admin, super_admin]
