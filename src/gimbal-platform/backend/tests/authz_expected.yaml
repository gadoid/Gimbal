# authz 人工审定快照(R7,dev-plan T0.2)—— 表 A 的期望值。
#
# 矩阵测试从表 A 生成只能证明「代码与表一致」(自证循环);本快照
# 是人工审定的期望,证明「表本身是对的」。表 A(_ownership.CAPABILITIES)
# 任何变更必须同步改这里 —— 快照即评审门,两边对拍不一致即红。
#
# 能力语义(v1,W2 收编的门面;W3-W9 只增不改语义):
#   users.manage     用户管理(开号/角色/停用/删除/重置密码)——原 admin 级
#   ops.write        技术运营(适配/别名 CRUD/环境/公告面)——原 member+ 级
#                     (W5 令牌签发、W7 导入开放至全体用户,不再覆盖)
#   alias.write      别名注册表新建条目(导入 decision=create 建名)——
#                     Admin 职责(§2.1);W7 起导入门放开后建名仍是 Admin 面
table_a:
  user: []                       # user 级:自有内容读写不走表 A(对象级规则在表 B,W3 起)
  admin: [ops.write, alias.write]
  super_admin: [users.manage, ops.write, alias.write]

# 具名门 → 能力映射(deps.py;名字保留是 W8 前的兼容期)
gates:
  AdminUser: users.manage
  MemberUser: ops.write

# roles_with 的顺序契约(权威顺序低→高;SQL in_ 与展示共用)
roles_with:
  users.manage: [super_admin]
  ops.write: [admin, super_admin]
  alias.write: [admin, super_admin]

# 表 B(authz W3):对象 × 动词 → 放行谓词(o=owner 属主 / pub=public
# 公共态 / ref=引用分享被授予人 / ste=steward:ops.write ∧ 公共)。
# 人工审定期望:
#   * admin/super_admin 对他人**私有**对象没有任何动词(全 404/403)
#   * 唯一的越属主能力 = steward 下架公共对象(scenario/suite.unpublish、
#     report_definition.delete —— W9-2 起编辑归维护者,Admin+ 仅下架)
#   * 发布(publish)一律 owner —— admin 对他人对象没有发布权(R6)
table_b:
  scenario:
    read:      [o, pub, ref]
    copy:      [o, pub, ref]
    run:       [o, ref]
    write:     [o]
    delete:    [o]
    publish:   [o]
    unpublish: [o, ste]
  suite:
    read:      [o, pub, ref]
    run:       [o, ref]
    write:     [o]
    delete:    [o]
    publish:   [o]
    unpublish: [o, ste]
  data_set:
    read:      [o, pub, ref]
    write:     [o]
  run_scheme:
    read:      [o, pub, ref]
    write:     [o]
  report_definition:
    read:      [o, pub]
    write:     [o]           # authz W9-2:编辑权 = 维护者单判
    delete:    [o, ste]      # 下架 = 维护者 ∨ Admin+(治理面)
