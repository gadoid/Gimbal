<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Suite 原型离线查看器</title>
<style>body{margin:0;background:#f5f3ee}</style>
</head>
<body>
<div id="root"></div>
<script>
// 极简 .dc.html 渲染器:只实现原型画板用到的子集
// ({{hole}} / <sc-for> / <sc-if> / <dc-import> / onClick / setState)。
// 用法:viewer.html?board=Main.dc.html&props={"startStep":2}
// 需经本地 HTTP 服务打开(fetch 同目录文件),例如 python3 -m http.server。
class DCLogic {
  constructor(props) { this.props = props; this.state = {}; }
  setState(s) { Object.assign(this.state, s); window.__rerender && window.__rerender(); }
}
const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
const WHOLE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;
const SVG = 'http://www.w3.org/2000/svg';
const cache = {};

function lookup(path, scope) {
  if (path === 'true') return true;
  if (path === 'false') return false;
  if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
  return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), scope);
}
function interp(str, scope) {
  return str.replace(HOLE, (_, p) => { const v = lookup(p, scope); return v == null ? '' : String(v); });
}
function attrValue(raw, scope) {
  const m = raw.match(WHOLE);
  return m ? lookup(m[1], scope) : interp(raw, scope);
}

async function loadBoard(name) {
  if (cache[name]) return cache[name];
  let src = await (await fetch(name)).text();
  // 表格里的自定义标签会被 HTML 解析器挪出表格:换成 <template> 保位
  src = src.replace(/<sc-for\b/g, '<template data-k="for"').replace(/<\/sc-for>/g, '</template>')
           .replace(/<sc-if\b/g, '<template data-k="if"').replace(/<\/sc-if>/g, '</template>');
  const doc = new DOMParser().parseFromString(src, 'text/html');
  const xdc = doc.querySelector('x-dc');
  const helmet = xdc.querySelector('helmet');
  const css = helmet ? [...helmet.querySelectorAll('style')].map(s => s.textContent).join('\n') : '';
  if (helmet) helmet.remove();
  const script = doc.querySelector('script[data-dc-script]');
  const propsDecl = JSON.parse(script.getAttribute('data-props') || '{}');
  const Component = new Function('DCLogic', script.textContent + '\n;return Component;')(DCLogic);
  const imports = [...xdc.querySelectorAll('dc-import')].map(n => n.getAttribute('name') + '.dc.html');
  for (const i of imports) await loadBoard(i);
  return (cache[name] = { xdc, css, propsDecl, Component });
}

function defaults(decl) {
  const out = {};
  for (const [k, v] of Object.entries(decl)) if (v && 'default' in v) out[k] = v.default;
  return out;
}

function instance(name, props) {
  const b = cache[name];
  const inst = new b.Component(Object.assign(defaults(b.propsDecl), props));
  return { b, inst };
}

function renderChildren(nodes, scope, parent, svg) {
  for (const n of nodes) renderNode(n, scope, parent, svg);
}

function renderNode(node, scope, parent, svg) {
  if (node.nodeType === 3) { parent.appendChild(document.createTextNode(interp(node.textContent, scope))); return; }
  if (node.nodeType !== 1) return;
  const tag = node.localName;
  const kids = node.content ? node.content.childNodes : node.childNodes;
  if (tag === 'template' && node.getAttribute('data-k') === 'for') {
    const list = attrValue(node.getAttribute('list'), scope) || [];
    const as = node.getAttribute('as');
    list.forEach((item, i) => renderChildren(kids, Object.assign({}, scope, { [as]: item, $index: i }), parent, svg));
    return;
  }
  if (tag === 'template' && node.getAttribute('data-k') === 'if') {
    if (attrValue(node.getAttribute('value'), scope)) renderChildren(kids, scope, parent, svg);
    return;
  }
  if (tag === 'dc-import') {
    const props = {};
    for (const a of node.attributes) {
      if (a.name === 'name' || a.name.startsWith('hint-')) continue;
      props[a.name.replace(/-([a-z])/g, (_, c) => c.toUpperCase())] = attrValue(a.value, scope);
    }
    mount(node.getAttribute('name') + '.dc.html', props, parent);
    return;
  }
  const isSvg = svg || tag === 'svg';
  const el = isSvg ? document.createElementNS(SVG, node.localName) : document.createElement(tag);
  for (const a of node.attributes) {
    const v = attrValue(a.value, scope);
    if (a.name.startsWith('on') && typeof v === 'function') { el.addEventListener(a.name.slice(2).toLowerCase(), v); continue; }
    if (v === false || v == null) continue;
    let name = a.name;
    if (name === 'href' && /\.dc\.html$/.test(v)) { el.setAttribute('href', 'viewer.html?board=' + v); continue; }
    el.setAttribute(name, v === true ? '' : v);
  }
  renderChildren(kids, scope, el, isSvg && tag !== 'foreignobject');
  parent.appendChild(el);
}

const mounted = [];
function mount(name, props, parent) {
  const { b, inst } = instance(name, props);
  const host = document.createElement('div');
  parent.appendChild(host);
  const draw = () => {
    host.innerHTML = '';
    const style = document.createElement('style');
    style.textContent = b.css;
    host.appendChild(style);
    renderChildren(b.xdc.childNodes, inst.renderVals(), host, false);
  };
  mounted.push(draw);
  draw();
}

(async () => {
  const q = new URLSearchParams(location.search);
  const board = q.get('board') || 'Main.dc.html';
  const props = JSON.parse(q.get('props') || '{}');
  await loadBoard(board);
  const root = document.getElementById('root');
  window.__rerender = () => mounted.forEach(d => d());
  mount(board, props, root);
  document.title = board;
  window.__ready = true;
})().catch(e => { document.body.textContent = String(e && e.stack || e); window.__ready = true; });
</script>
</body>
</html>
