          <span style="color: #F8FAFC; font-weight: 500;">鳕鱼</span>
          <span style="font-size: 10px; padding: 0 6px; border-radius: 9999px; background: rgba(255,255,255,0.12); color: #CBD5E1;">管理员</span>
          <span style="width: 6px; height: 6px; border-radius: 9999px; background: #F59E0B;" aria-label="有令牌即将到期或已失效"></span>
        </button>
      </div>

      <div role="menu" style="position: absolute; top: 54px; right: 14px; width: 208px; background: #FFFFFF; border: 1px solid #E1E5EB; border-radius: 8px; box-shadow: 0 8px 24px rgba(16, 21, 28, 0.12); padding: 4px; display: flex; flex-direction: column;">

          <span style="font-weight: 600;">鳕鱼</span>

        </div>
        <div style="height: 1px; background: #EEF0F3; margin: 4px 0;"></div>
        <a role="menuitem" href="Main.dc.html" style="display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 6px; color: #10151C; text-decoration: none;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
          个人设置
        </a>
        <a role="menuitem" href="Tokens.dc.html" style="display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 6px; background: #F6F8FC; color: #10151C; text-decoration: none;">

        <div style="height: 1px; background: #EEF0F3; margin: 4px 0;"></div>
        <button type="button" role="menuitem" style="display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 0; border-radius: 6px; background: transparent; color: #DC2626; font-size: 13px; text-align: left;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="m16 17 5-5-5-5"></path><path d="M21 12H9"></path></svg>
          登出
        </button>
      </div>
    </div>
  </div>

  <!-- 侧栏底部 -->
  <div style="flex: none; display: flex; flex-direction: column; gap: 10px;">
    <span style="font-size: 12px; font-weight: 600; color: #5B6472;">侧栏底部</span>
    <div style="width: 208px; height: 340px; background: #0B0E14; border-radius: 10px; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px;">

          <span style="width: 6px; height: 6px; border-radius: 9999px; background: #F59E0B;" aria-label="有令牌即将到期或已失效"></span>
          <span style="font-size: 10px; padding: 0 6px; border-radius: 9999px; background: rgba(255,255,255,0.12); color: #CBD5E1;">管理员</span>
        </span>

      <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 2px;">
        <button type="button" aria-label="通知" style="width: 28px; height: 28px; border: 0; background: transparent; color: #CBD5E1;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path></svg>
        </button>
        <button type="button" style="height: 26px; padding: 0 8px; border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; background: transparent; color: #CBD5E1; font-size: 11px;">退出</button>
