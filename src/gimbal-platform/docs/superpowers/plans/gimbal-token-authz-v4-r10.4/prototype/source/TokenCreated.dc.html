<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>访问令牌明文</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#2F6FED}a:hover{color:#1F55C4}
</style>
</helmet>
<div style="width: 880px; height: 680px; box-sizing: border-box; background: rgba(16, 21, 28, 0.45); display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial, &quot;Noto Sans&quot;, &quot;PingFang SC&quot;, sans-serif; font-size: 13px; line-height: 18px; color: #10151C;">
  <div role="dialog" aria-labelledby="dlg-title" style="width: 640px; background: #FFFFFF; border-radius: 10px; box-shadow: 0 8px 24px rgba(16, 21, 28, 0.12); display: flex; flex-direction: column; overflow: hidden;">
    <div style="padding: 18px 22px 14px; border-bottom: 1px solid #EEF0F3; display: flex; flex-direction: column; gap: 4px;">
      <h2 id="dlg-title" style="margin: 0; font-size: 16px; line-height: 22px; font-weight: 600;">{{title}}</h2>
      <span style="font-size: 12px; color: #5B6472;">{{subtitle}}</span>
    </div>

    <div style="padding: 18px 22px; display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 8px; background: #FEF3C7; color: #92400E; font-size: 12px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="flex: none; margin-top: 1px;"><path d="M12 9v4"></path><path d="M12 17h.01"></path><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path></svg>
        <span>{{warning}}</span>
      </div>

      <sc-for list="{{secrets}}" as="s" hint-placeholder-count="2">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <span style="font-size: 12px; font-weight: 500; color: #5B6472;">{{s.label}}</span>
          <div style="display: flex; gap: 8px; align-items: center;">
            <code style="flex-grow: 1; min-width: 0; padding: 8px 10px; border: 1px solid #E1E5EB; border-radius: 6px; background: #F6F8FC; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{s.value}}</code>
            <button type="button" style="height: 32px; padding: 0 12px; border: 1px solid #E1E5EB; border-radius: 6px; background: #FFFFFF; color: #10151C; font-size: 12px;">复制</button>
          </div>
        </div>
      </sc-for>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <span style="font-size: 12px; font-weight: 500; color: #5B6472;">调用示例</span>
          <button type="button" style="height: 24px; padding: 0 8px; border: 1px solid #E1E5EB; border-radius: 4px; background: #FFFFFF; color: #10151C; font-size: 12px;">复制</button>
        </div>
        <pre style="margin: 0; padding: 10px 12px; border-radius: 6px; background: #10151C; color: #E2E8F0; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; line-height: 18px; white-space: pre-wrap;">curl -X POST https://gimbal.internal/api/runs \
  -H "Authorization: Bearer gtk_••••••••" \
  -d '{"scenarioId": "sc-…", "schemeId": "…"}'</pre>
      </div>
    </div>

    <div style="padding: 14px 22px; border-top: 1px solid #EEF0F3; display: flex; align-items: center; gap: 10px;">
      <label style="display: flex; align-items: center; gap: 8px; font-size: 13px;">
        <input type="checkbox" checked="checked" style="width: 16px; height: 16px; margin: 0;">
        我已妥善保存
      </label>
      <div style="flex-grow: 1;"></div>
      <a href="Tokens.dc.html" style="display: inline-flex; align-items: center; height: 32px; padding: 0 16px; border-radius: 6px; background: #2F6FED; color: #FFFFFF; font-size: 13px; font-weight: 500; text-decoration: none;">完成</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["create","create-platform","regenerate"],"default":"create","section":"状态"},"$preview":{"width":880,"height":680}}'>
class Component extends DCLogic {
  renderVals() {
    const mode = this.props.mode ?? 'create';
    const regen = mode === 'regenerate';
    if (mode === 'create-platform') {
      return {
        title: '平台令牌已创建 · nightly-recon',
        subtitle: '90 天有效，至 2027-02-02 · 以平台身份执行：仅公共且只读的场景 · 3 个服务别名、1 个平台凭证',
        warning: '下面两项只显示这一次，关闭后无法再查看；丢失请重新生成。平台令牌占用全平台共享额度（已用 3 / 5）。',
        secrets: [
          { label: '访问令牌 · Authorization: Bearer', value: 'gtk_[一次性明文]' },
          { label: '回调签名密钥（已填回调地址时）', value: '[一次性明文 · HMAC 密钥]' }
        ]
      };
    }
    if (regen) {
      return {
        title: '已重新生成 · regress-bot',
        subtitle: '90 天有效，至 2027-02-02 · 范围与回调配置保持不变',
        warning: '新令牌只显示这一次。旧明文已立即作废，请在调用方换上新令牌。经此令牌注册的定时任务不受影响；因失效或到期暂停的 1 个任务将自动恢复。',
        secrets: [
          { label: '访问令牌 · Authorization: Bearer', value: 'gtk_[一次性明文]' }
        ]
      };
    }
    return {
      title: '访问令牌已创建 · agent-nightly',
      subtitle: '90 天有效，至 2027-02-02 · 代表 codfish 本人执行 · 2 个服务别名、2 个凭证',
      warning: '下面两项只显示这一次，关闭后无法再查看；丢失请重新生成。',
      secrets: [
        { label: '访问令牌 · Authorization: Bearer', value: 'gtk_[一次性明文]' },
        { label: '回调签名密钥（已填回调地址时）', value: '[一次性明文 · HMAC 密钥]' }
      ]
    };
  }
}
</script>
</body>
</html>
