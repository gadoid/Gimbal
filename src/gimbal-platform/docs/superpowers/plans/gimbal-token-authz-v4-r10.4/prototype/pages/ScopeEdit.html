<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>编辑授权范围</title><style>
body{margin:0}
a{color:#2F6FED}a:hover{color:#1F55C4}
</style></head><body>

<div style="width: 880px; height: 680px; box-sizing: border-box; background: rgba(16, 21, 28, 0.45); display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial, &quot;Noto Sans&quot;, &quot;PingFang SC&quot;, sans-serif; font-size: 13px; line-height: 18px; color: #10151C;">
  <div role="dialog" aria-labelledby="scope-title" style="width: 640px; background: #FFFFFF; border-radius: 10px; box-shadow: 0 8px 24px rgba(16, 21, 28, 0.12); display: flex; flex-direction: column; overflow: hidden;">
    <div style="padding: 18px 22px 14px; border-bottom: 1px solid #EEF0F3; display: flex; flex-direction: column; gap: 4px;">
      <h2 id="scope-title" style="margin: 0; font-size: 16px; line-height: 22px; font-weight: 600;">编辑授权范围 · agent-nightly</h2>
      <span style="font-size: 12px; color: #5B6472;">保存即生效；已注册任务在下次运行前重新核对</span>
    </div>

    <div style="padding: 18px 22px; display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
        <span style="width: 64px; font-size: 12px; color: #5B6472;">服务别名</span>
        
          <button type="button" aria-pressed="false" style="height: 26px; padding: 0 10px; border-radius: 9999px; border: 1px solid #FCA5A5; background: #FFFFFF; color: #B91C1C; font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-decoration: line-through;">fin-test</button>
        
          <button type="button" aria-pressed="true" style="height: 26px; padding: 0 10px; border-radius: 9999px; border: 1px solid #2F6FED; background: #E7EFFF; color: #1F55C4; font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-decoration: none;">logi-test</button>
        
          <button type="button" aria-pressed="false" style="height: 26px; padding: 0 10px; border-radius: 9999px; border: 1px solid #E1E5EB; background: #FFFFFF; color: #10151C; font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-decoration: none;">wms-test</button>
        
          <button type="button" aria-pressed="false" style="height: 26px; padding: 0 10px; border-radius: 9999px; border: 1px solid #E1E5EB; background: #FFFFFF; color: #10151C; font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-decoration: none;">mall-uat</button>
        
      </div>
      <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
        <span style="width: 64px; font-size: 12px; color: #5B6472;">凭证</span>
        
          <button type="button" aria-pressed="false" style="height: 26px; padding: 0 10px; border-radius: 9999px; border: 1px solid #FCA5A5; background: #FFFFFF; color: #B91C1C; font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-decoration: line-through;">codfish-fin</button>
        
          <button type="button" aria-pressed="true" style="height: 26px; padding: 0 10px; border-radius: 9999px; border: 1px solid #2F6FED; background: #E7EFFF; color: #1F55C4; font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-decoration: none;">codfish-logi</button>
        
          <button type="button" aria-pressed="false" style="height: 26px; padding: 0 10px; border-radius: 9999px; border: 1px solid #E1E5EB; background: #FFFFFF; color: #10151C; font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-decoration: none;">codfish2</button>
        
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 8px; background: #FEF2F2; border: 1px solid #FECACA;">
        <span style="font-size: 12px; font-weight: 600; color: #991B1B;">收紧后，1 个已注册任务将不满足范围，会在下次运行前暂停</span>
        <div style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: #FFFFFF; border: 1px solid #E1E5EB; border-radius: 6px; font-size: 12px;">
          <span style="flex-grow: 1;">每日应收对账</span>
          <span style="color: #5B6472;">用到 fin-test · codfish-fin</span>
        </div>
        <span style="font-size: 11px; color: #5B6472;">范围恢复后任务可在集成详情里重新启动；调用方的即时调用会直接返回范围外的别名与凭证。</span>
      </div>
    </div>

    <div style="padding: 14px 22px; border-top: 1px solid #EEF0F3; display: flex; align-items: center; gap: 10px; justify-content: flex-end;">
      <a href="Tokens.html" style="display: inline-flex; align-items: center; height: 32px; padding: 0 14px; border: 1px solid #E1E5EB; border-radius: 6px; background: #FFFFFF; color: #10151C; font-size: 13px; text-decoration: none; box-sizing: border-box;">取消</a>
      <a href="Tokens.html" style="display: inline-flex; align-items: center; height: 32px; padding: 0 14px; border-radius: 6px; background: #DC2626; color: #FFFFFF; font-size: 13px; font-weight: 500; text-decoration: none;">仍然保存</a>
    </div>
  </div>
</div>
</body></html>
