<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>便签卡 · S / M / L</title><style>

</style></head><body>

<div style="width: 1400px; height: 600px; box-sizing: border-box; padding: 32px 40px; background: #F3F5F8; display: flex; gap: 32px; align-items: flex-start; font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial, &quot;Noto Sans&quot;, &quot;PingFang SC&quot;, sans-serif; font-size: 13px; line-height: 18px; color: #10151C;">

        <span style="font-size: 11px; color: #5B6472;">2 条未完成</span>
      </div>
      
        <span style="font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">· 周五前给物流轨迹同步补 wms-test 授权</span>
      
        <span style="font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">· #4790 退款失败，找开发确认</span>

        <label style="display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; border-bottom: 1px solid #EEF0F3; font-size: 12px; color: #10151C;">

          <span style="flex-grow: 1; text-decoration: none;">周五前给物流轨迹同步补 wms-test 授权</span>

        <label style="display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; border-bottom: 1px solid #EEF0F3; font-size: 12px; color: #10151C;">

          <input type="checkbox" checked="checked" style="width: 14px; height: 14px; margin: 2px 0 0; flex: none;">

          <button type="button" aria-pressed="false" style="height: 26px; padding: 0 10px; border: 0; border-left: 1px solid #E1E5EB; background: #FFFFFF; color: #10151C; font-size: 12px;">已完成</button>

        <div style="display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px solid #EEF0F3; font-size: 12px; color: #10151C;">
          <input type="checkbox" aria-label="完成" style="width: 14px; height: 14px; margin: 2px 0 0; flex: none;">
          <span style="flex-grow: 1; text-decoration: none;">周五前给物流轨迹同步补 wms-test 授权</span>
          <span style="color: #5B6472; white-space: nowrap;">今天 14:20</span>
          <button type="button" aria-label="删除" style="width: 22px; height: 22px; border: 0; background: transparent; color: #5B6472; padding: 0;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
          </button>
        </div>
      
        <div style="display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px solid #EEF0F3; font-size: 12px; color: #10151C;">
          <input type="checkbox" aria-label="完成" style="width: 14px; height: 14px; margin: 2px 0 0; flex: none;">

          <button type="button" aria-label="删除" style="width: 22px; height: 22px; border: 0; background: transparent; color: #5B6472; padding: 0;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
          </button>
        </div>
      
        <div style="display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px solid #EEF0F3; font-size: 12px; color: #8B93A1;">
          <input type="checkbox" checked="checked" aria-label="完成" style="width: 14px; height: 14px; margin: 2px 0 0; flex: none;">
          <span style="flex-grow: 1; text-decoration: line-through;">更新 ci-jenkins 令牌</span>
          <span style="color: #5B6472; white-space: nowrap;">11-02</span>
          <button type="button" aria-label="删除" style="width: 22px; height: 22px; border: 0; background: transparent; color: #5B6472; padding: 0;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
          </button>
        </div>
      
      <div style="display: flex; justify-content: flex-end;">
        <button type="button" style="height: 26px; padding: 0 10px; border: 1px solid #E1E5EB; border-radius: 4px; background: #FFFFFF; color: #10151C; font-size: 12px;">清空已完成（1）</button>
      </div>
    </section>
  </div>
</div>
