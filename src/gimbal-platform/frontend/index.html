<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gimbal Platform</title>
    <script>
      // 首帧防闪:CSS 加载前恢复主题(useTheme 同键 gimbal-theme;
      // dark 或 system∧系统暗 → 写 data-theme,其余缺省 —— 与
      // dual-theme.css 选择器单一覆盖面)
      try {
        var t = localStorage.getItem('gimbal-theme') || 'system';
        if (t === 'dark' || (t === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch (e) { /* 隐私模式等:按日间首帧 */ }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
