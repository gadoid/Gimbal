# config/env/gimbal_staging.yaml

env: staging
services:
  settlement_api:
    base_url: "http://sit-gateway.internal:8080"
    timeout: 30
  legacy_php:
    base_url: "http://sit-php.internal:9000"
    timeout: 30
  
database:
  mysql:
    host: sit-db.internal
    port: 3306
    database: trade_settlement
  redis:
    host: sit-redis.internal
    port: 6379
    db: 0
    
users_pool:
  admin:
    url: "https://api.example.com/login"
    username: "admin"
    password: "secret"
    expires_in: 7200
    token_type: "Bearer"
  service_a:
    url: "https://api.example.com/m2m/token"
    username: "client_id"
    password: "client_secret"
    expires_in: 3600
    token_type: "Bearer"