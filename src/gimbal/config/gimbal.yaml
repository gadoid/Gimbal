env: dev
services:
  settlement_api:
    base_url: "http://sit-gateway.internal:8080"
    timeout: 30
  legacy_php:
    base_url: "http://sit-php.internal:9000"
    timeout: 30
  
database:
  mysql:
    host: sit-db.internal
    port: 3306
    database: trade_settlement
  redis:
    host: sit-redis.internal
    port: 6379
    db: 0

users:
  admin:
    url: "https://api.example.com/login"
    username: "admin"
    password: "secret"
    expires_in: 7200
    token_type: "Bearer"
  service_a:
    url: "https://api.example.com/m2m/token"
    username: "client_id"
    password: "client_secret"
    expires_in: 3600
    token_type: "Bearer"
mode: local

execution:
  parallel_workers: 4
  retry_count: 2
  retry_interval: 3          # seconds
  fail_fast: true            # 首次失败即停止 suite
  
timeout:
  request: 15                # 单请求超时
  scenario: 120              # 单用例超时
  suite: 1800                # 整个 suite 超时

scope:
  tags_include: ["smoke", "regression"]
  tags_exclude: ["manual", "slow", "wip"]
  priority_threshold: P2     # 只跑 P0/P1/P2

reporter:
  level: summary             # summary / detailed / debug
  screenshot_on_fail: true
  attach_request_log: false  # CI 环境减少产物体积
  output_formats: ["html"]

chaos:                       # Chaos Strategy 开关
  enabled: false
  
poll:
  default_interval: 5
  default_timeout: 60

plugin_configs:
  gimbal-test-report:
    output_path: ./reports/test-report.html
    title: "Gimbal Test Report"
    include_passed: true