# 入库闸门(批次 D,评审 P1):plate check + 三侧测试。
# check 含 common 参照(N3:common 变更触发全部引用系统重校验 —— 本工作流
# 对全树跑 check,天然覆盖)。
name: plate-ci
on:
  pull_request:
    paths:
      - "systems/**"
      - "types/**"
      - "src/gimbal/**"
      - "src/gimbal_plate/**"
      - "src/gimbal-plate/**"
      - "src/gimbal-platform/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/plate-ci.yml"
  push:
    branches: [main]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (editable, plate entry included)
        run: pip install -e .[dev]
      - name: 入库闸门 — plate check(规则编号即错误码)
        run: |
          set -e
          # S1.5a:--all 遍历 systems 根下全部目录——写死系统名清单时,
          # 多出来的目录(如 fin.v2)能过 CI 却在服务里被 loader 静默跳过;
          # --all 逐目录过闸门并对不合规目录名点名报错(common 的 F2 口径
          # 同各系统)。规范形守门(render(parse(x)) == x)随 tests/plate
          # 的 test_canonical_tree 执行。
          plate check --all --json
      - name: 方言纪律 — 真源树可解析 + 一文件一交付物
        run: pytest tests/plate/test_v3_one_file_per_endpoint.py tests/plate/dialect -q
      - name: plate 全量
        run: pytest tests/plate -q
      - name: 执行器全量
        run: pytest tests/unit tests/integration -q
      # 评审第三轮:非 editable 安装冒烟——`pip install .` 后 plate 命令
      # 必须可用(此前 wheel 丢 gimbal_plate 包,-e 安装测不出来)。
      # 第四轮 M2:冒烟升级为真实 check——PLATE_REPO_ROOT 指到 checkout
      # (wheel 装进 venv 后包位置回溯不到数据目录,必须显式给根)。
      - name: 非 editable 安装冒烟
        run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/pip install -q .
          /tmp/wheelenv/bin/plate --help >/dev/null
          /tmp/wheelenv/bin/python -c "import gimbal_plate, gimbal; print('non-editable install OK')"
          PLATE_REPO_ROOT="$PWD" /tmp/wheelenv/bin/plate check fin --json >/dev/null
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: vitest
        working-directory: src/gimbal-platform/frontend
        run: |
          npm ci || npm install
          npx vue-tsc --noEmit
          npx vitest run --silent
