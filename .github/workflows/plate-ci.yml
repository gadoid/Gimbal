# 入库闸门(批次 D,评审 P1):plate check + 三侧测试。
# check 含 common 参照(N3:common 变更触发全部引用系统重校验 —— 本工作流
# 对全树跑 check,天然覆盖)。
name: plate-ci
on:
  pull_request:
    paths:
      - "systems/**"
      - "types/**"
      - "src/gimbal/**"
      - "src/gimbal_plate/**"
      - "src/gimbal-plate/**"
      - "src/gimbal-platform/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/plate-ci.yml"
  push:
    branches: [main]
  # 手动触发(A-2,2026-10-13):分支不走 PR 流时 CI 从未跑过 ——
  # 至少允许一键全量验证(四侧 + 闸门),不必等开 PR。
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-latest
    # 2-5(2026-10-13)+SQLite 退役(2026-10-14):后端测试 PG-only
    # (conftest 要求 TEST_DATABASE_URL,SQLite 方言已删)—— 后端全量
    # 与空库门都吃这个 service;FK 种子/时区混比/JSONB 键序/扩展 schema
    # 类问题只有 PG 面能拦(原 backend-pg job 并入本 job)。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gimbal
          POSTGRES_PASSWORD: gimbal
          POSTGRES_DB: gimbal
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gimbal"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      # fetch-depth: 0 —— compat 需要读 origin/main 的 m2.schema.json;
      # 默认浅克隆只有 PR 本身,取不到目标分支(评审第九轮)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (lock 精确版本 + editable 本仓包)
        run: |
          # 整体评审 2026-10-15 #6:按仓库根 requirements.lock 安装全部三方
          # 依赖(执行器/plate dev 组 + 平台后端,含 pytest-asyncio),本仓
          # 两个包 --no-deps editable 装 —— CI 与部署同一组精确版本,不再
          # 被上游新版(sqlalchemy 2.1 greenlet、fastapi 内部路由等)突袭。
          # 依赖变更须同提交重生 lock(命令见 requirements.in 头注)。
          pip install -r requirements.lock
          pip install --no-deps -e . -e src/gimbal-platform/backend
          # lock 与 pyproject 一致性:pyproject 改了上下界却没重生 lock
          # 时这里红(pip 按 pyproject 依赖声明复核已装版本)
          pip check
      # 评审 G-2/7.1-7:未定义名称守卫——plate_pins_container / m2_info /
      # Session 这类一跑就崩的缺陷不再进入提交。只拦 F821(未定义名),
      # unused 类噪音不在此门。
      - name: 未定义名称守卫 — pyflakes(undefined names)
        run: |
          pip install -q pyflakes
          python -m pyflakes src/gimbal src/gimbal_plate src/gimbal-platform/backend/app src/gimbal-platform/backend/tests scripts 2>&1 | grep -E "undefined name" && exit 1 || true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: M2 漂移守卫 — gen_m2 check(生成物与当前定义一致)
        run: |
          set -e
          npx --yes json-schema-to-typescript@16.0.0 --version
          python scripts/gen_m2.py check --targets schema,ext,py,ts,dbgcmd
      - name: M2 兼容性守卫 — gen_m2 compat(不兼容变更须递增代际)
        # PR 的目标分支不是 main 时也能正确比对(github.base_ref)
        run: python scripts/gen_m2.py compat --base "origin/${{ github.base_ref || 'main' }}"
      - name: 入库闸门 — plate check(规则编号即错误码)
        run: |
          set -e
          # S1.5a:--all 遍历 systems 根下全部目录——写死系统名清单时,
          # 多出来的目录(如 fin.v2)能过 CI 却在服务里被 loader 静默跳过;
          # --all 逐目录过闸门并对不合规目录名点名报错(common 的 F2 口径
          # 同各系统)。规范形守门(render(parse(x)) == x)随 tests/plate
          # 的 test_canonical_tree 执行。
          plate check --all --json
      - name: 方言纪律 — 真源树可解析 + 一文件一交付物
        run: pytest tests/plate/test_v3_one_file_per_endpoint.py tests/plate/dialect -q
      - name: plate 全量
        run: pytest tests/plate -q
      - name: 执行器全量
        run: pytest tests/unit tests/integration -q
      # 评审 G-2:回归全部集中在平台后端,而 CI 此前根本没跑它——
      # 与 plate/执行器/前端并列的第四侧,不许再缺席。
      # SQLite 退役(2026-10-14):PG-only,conftest 无 TEST_DATABASE_URL
      # 即中止 —— env 必给。
      - name: 平台后端全量(PG)
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://gimbal:gimbal@localhost:5432/gimbal
        run: pytest src/gimbal-platform/backend/tests -q
      # 空库门 PG 面(原 backend-pg job 并入):临时 schema 单搜索路径
      # 等价干净空库,0003 扩展/0022 jsonb 类漂移只有这面能拦。
      - name: 空库门 PG 面
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://gimbal:gimbal@localhost:5432/gimbal
        run: pytest src/gimbal-platform/backend/tests/test_empty_db_bootstrap.py -q
      # 增量升级门(合入评估 §2-2,二修):从 SNAPSHOT_REF 钉定的交付点
      # 快照(worktree 用交付点自己的模型建库 —— 免疫「当前模型 create_all
      # 同义反复」)upgrade 到 head,再与模型比对;窗口 = 快照后的全部
      # 迁移及其返工,守卫不再跳过。白名单仅 trgm 索引。快照 ref 随发版
      # 推进;长期 = 迁移链压平为冻结静态 DDL。service 容器内 gimbal 是
      # 超级用户,脚本默认建临时库 gimbal_chain。
      - name: 增量升级门(快照交付点 → head vs 模型)
        run: >
          python scripts/check_migration_drift.py
          --url postgresql://gimbal:gimbal@localhost:5432/gimbal
      # 评审第三轮:非 editable 安装冒烟——`pip install .` 后 plate 命令
      # 必须可用(此前 wheel 丢 gimbal_plate 包,-e 安装测不出来)。
      # 第四轮 M2:冒烟升级为真实 check——PLATE_REPO_ROOT 指到 checkout
      # (wheel 装进 venv 后包位置回溯不到数据目录,必须显式给根)。
      - name: 非 editable 安装冒烟
        run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/pip install -q -c requirements.lock .
          /tmp/wheelenv/bin/plate --help >/dev/null
          /tmp/wheelenv/bin/python -c "import gimbal_plate, gimbal; print('non-editable install OK')"
          PLATE_REPO_ROOT="$PWD" /tmp/wheelenv/bin/plate check fin --json >/dev/null
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: vitest
        working-directory: src/gimbal-platform/frontend
        run: |
          npm ci || npm install
          npx vue-tsc --noEmit
          npx vitest run --silent
